---
name: Build

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - develop
      - develop-*
  release:
    types:
      - published
  schedule:
    # Weekly image refresh (updates the edge tag). Daily CVE monitoring is
    # handled by _rescan.yml against the attested SBOMs; floating-tag
    # reconciliation after release edits is handled by _retag.yml.
    - cron: 0 10 * * 1 # Mondays at 10am
  workflow_dispatch:

concurrency:
  # Key the group on the fully-qualified ref so each event type gets its own
  # lane: pushes use `refs/heads/<branch>`, pull requests use
  # `refs/pull/<n>/merge`, and the merge queue uses its own ref. Because those
  # namespaces never overlap, a pull_request run can no longer cancel the push
  # run for the same branch (and vice versa). That cross-event cancellation
  # left a cancelled `CI Gate` status check on the head commit, which branch
  # protection treated as a failing required check and refused to merge.
  # cancel-in-progress still supersedes older runs *within* a ref (a new push
  # or a new PR sync), which is safe because required checks are only
  # evaluated against the latest commit SHA.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant write scopes per job; a workflow-level grant would hand every
# job (lint, diagnostics, config) a write-capable token it never needs.
permissions: {}

jobs:
  diagnostics:
    name: Diagnostics
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@v5

  config:
    name: Config
    permissions:
      contents: read
    uses: ./.github/workflows/_config.yml

  lint:
    name: Lint
    permissions:
      contents: read
    uses: felddy/reusable-workflows/.github/workflows/common-lint.yml@v5

  pipeline:
    name: Pipeline (${{ matrix.flavor }})
    needs:
      - diagnostics
      - config
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # The public image ships without Foundry binaries; the private
          # preinstall image authenticates during the build and embeds them,
          # so it is published unlinked (private) and scanned without a gate
          # (third-party binaries are not actionable here).
          - flavor: public
            image-name: felddy/foundryvtt
            platforms-source: platforms
            private: false
            pass-build-secrets: false
            scan-severity: CRITICAL,HIGH
            upload-scan-results: true
            mirror: true
            readme: true
            test-secret-1-name: FOUNDRY_USERNAME
            test-secret-2-name: FOUNDRY_PASSWORD
          - flavor: preinstall
            image-name: felddy/foundryvtt-preinstall
            platforms-source: test_platforms
            private: true
            pass-build-secrets: true
            scan-severity: ""
            upload-scan-results: false
            mirror: false
            readme: false
            test-secret-1-name: ""
            test-secret-2-name: ""
    permissions:
      actions: read
      # contents: write lets the pipeline record image digests in release
      # notes; every other pipeline job narrows back to contents: read.
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: felddy/reusable-workflows/.github/workflows/container-pipeline.yml@v5
    with:
      image-name: ${{ matrix.image-name }}
      platforms: ${{ needs.config.outputs[matrix.platforms-source] }}
      test-platforms: ${{ needs.config.outputs.test_platforms }}
      private: ${{ matrix.private }}
      pass-build-secrets: ${{ matrix.pass-build-secrets }}
      scan-severity: ${{ matrix.scan-severity }}
      upload-scan-results: ${{ matrix.upload-scan-results }}
      build-args: |
        CONTAINER_VERSION=${{ needs.config.outputs.container_version }}
        FOUNDRY_VERSION=${{ needs.config.outputs.foundry_version }}
      build-secret-1-name: foundry_password
      build-secret-2-name: foundry_username
      test-secret-1-name: ${{ matrix.test-secret-1-name }}
      test-secret-2-name: ${{ matrix.test-secret-2-name }}
      mirror-on-release: ${{ matrix.mirror }}
      publish-readme-on-release: ${{ matrix.readme }}
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}
      docker-hub-username: ${{ secrets.DOCKER_USERNAME }}
      docker-hub-password: ${{ secrets.DOCKER_PASSWORD }}
      build-secret-1: ${{ secrets.FOUNDRY_PASSWORD }}
      build-secret-2: ${{ secrets.FOUNDRY_USERNAME }}
      test-secret-1: ${{ secrets.FOUNDRY_USERNAME }}
      test-secret-2: ${{ secrets.FOUNDRY_PASSWORD }}

  ci-gate:
    name: CI Gate
    needs:
      - diagnostics
      - config
      - lint
      - pipeline
    # Run whether dependencies succeed, fail, or are skipped so the gate can
    # evaluate their results -- but NOT when the run itself is cancelled (for
    # example when superseded via `concurrency`). `always()` would execute
    # even during cancellation and report a spurious failure; `!cancelled()`
    # still runs when a dependency *fails* (failure is not cancellation), so
    # genuine failures are caught while cancelled runs simply skip the gate.
    if: ${{ !cancelled() }}
    permissions: {}
    uses: felddy/reusable-workflows/.github/workflows/ci-gate.yml@v5
    with:
      needs-json: ${{ toJSON(needs) }}
