---
name: Rescan

# Daily CVE monitoring of the released images: scans the attested SBOMs of
# the latest release without rebuilding or pulling images. A red run means
# the fix is to cut a new release. Unreleased tags (develop, edge) are not
# scanned; scheduled builds refresh those on their own.

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 10 * * * # everyday at 10am
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  rescan:
    name: Rescan Container
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: felddy/reusable-workflows/.github/workflows/container-rescan.yml@v5
    with:
      image-name: felddy/foundryvtt

  rescan-preinstall:
    name: Rescan Container Pre-Installed
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    uses: felddy/reusable-workflows/.github/workflows/container-rescan.yml@v5
    with:
      image-name: felddy/foundryvtt-preinstall
      # Third-party Foundry binaries are embedded; report findings without
      # failing the run, matching the build-time scan policy.
      scan-severity: ""
      upload-scan-results: false
    secrets:
      private-package-token: ${{ secrets.PRIVATE_PACKAGE_TOKEN }}
