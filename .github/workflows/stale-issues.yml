---
name: Label and close stale issues

# Trigger-only stub: the dual-trigger stale-issues workflow in
# felddy/reusable-workflows does the work.

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 10 * * * # everyday at 10am
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    uses: felddy/reusable-workflows/.github/workflows/stale-issues.yml@v5
    permissions:
      issues: write
