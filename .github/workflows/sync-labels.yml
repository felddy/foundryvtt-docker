---
name: sync-labels

# Trigger-only stub: the dual-trigger sync-labels workflow in
# felddy/reusable-workflows does the work.
# Label definitions are central; a local .github/labels.yml, if ever
# added, merges over them as a repo-specific overlay.

on: # yamllint disable-line rule:truthy
  push:
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml
  schedule:
    - cron: 17 5 * * 1 # weekly, Monday morning
  workflow_dispatch:

permissions: {}

jobs:
  labeler:
    uses: felddy/reusable-workflows/.github/workflows/sync-labels.yml@v5
    permissions:
      contents: read
      issues: write
