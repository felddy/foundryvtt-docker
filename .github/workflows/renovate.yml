---
name: Renovate

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 38 */6 * * * # four times a day, offset from the build cron
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level
        options:
          - debug
          - info
        required: false
        type: choice

defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

concurrency:
  # Only one Renovate run at a time; a second scheduled run would race the
  # first on branch creation and rebasing.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    name: Run Diagnostics
    uses: felddy/reusable-workflows/.github/workflows/diagnostics.yml@c37b510076afebbca32009d7869267ae3e0b62e6 # tag=v5.0.0

  renovate:
    needs:
      - diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # tag=v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            pypi.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - name: Generate a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # tag=v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # tag=v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The full image ships python and uv, which the postUpgradeTasks
          # render of README.md needs (the slim default image has neither).
          renovate-version: full
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # Only operate on this repository; the repository-level config at
          # .github/renovate.json controls what gets updated.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The config is committed, so skip onboarding PRs.
          RENOVATE_ONBOARDING: "false"
          # postUpgradeTasks commands are opt-in; only the README render
          # script may run.  This is a global (bot admin) option, so it
          # lives here rather than in .github/renovate.json.
          RENOVATE_ALLOWED_COMMANDS: '["^sh render-docs-update$"]'
          # Commit via the GitHub API as the App instead of `git push`.  This
          # produces GitHub-verified (signed) commits and makes the commit
          # author identical to the one used by the renovate-readme-sync
          # workflow, so Renovate does not treat the rendered README commit
          # as a user modification and keeps rebasing its branches.
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_DRY_RUN: ${{ inputs.dry-run == true && 'full' || null }}
