---
name: Renovate

# Trigger-only stub: the dual-trigger renovate workflow in
# felddy/reusable-workflows does the work.
# What gets updated is governed by the local .github/renovate.json; the
# App id comes from the RENOVATE_APP_ID repository variable and the
# private key from the RENOVATE_PRIVATE_KEY secret.

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 38 */6 * * * # four times a day, offset from the build cron
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Log what would happen without creating branches or PRs
        required: false
        type: boolean
      log-level:
        default: info
        description: Renovate log level
        options:
          - debug
          - info
        required: false
        type: choice

concurrency:
  # Only one Renovate run at a time; the called workflow's own
  # concurrency group is ignored for reusable calls.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    uses: felddy/reusable-workflows/.github/workflows/renovate.yml@v5
    with:
      dry-run: ${{ inputs.dry-run || false }}
      log-level: ${{ inputs.log-level || 'info' }}
    secrets: inherit
    permissions:
      contents: read
