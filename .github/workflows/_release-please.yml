---
name: Release Please

# Runs the reusable release-please workflow against this repository. The
# container version tracks upstream Foundry VTT: Renovate's foundryvtt bump
# commits carry a Release-As footer that pins the next release to the
# upstream version, and container-only changes bump the patch level between
# Foundry builds (versioning: always-bump-patch in the config). Releases
# publish with RELEASE_PLEASE_TOKEN so the Build pipeline runs on them.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - develop

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: felddy/reusable-workflows/.github/workflows/release-please.yml@v5
    secrets:
      release-please-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
