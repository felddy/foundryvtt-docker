---
name: CodeQL

# Trigger-only stub: the dual-trigger codeql-analysis workflow in
# felddy/reusable-workflows does the work.

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  pull_request:
    # The branches here must be a subset of the ones in the push key
    branches:
      - develop
      - develop-prerelease
  push:
    # Dependabot-triggered push events have read-only access, but uploading code
    # scanning requires write access.
    branches-ignore:
      - dependabot/**
  schedule:
    - cron: 31 7 * * 2

permissions: {}

jobs:
  codeql:
    uses: felddy/reusable-workflows/.github/workflows/codeql-analysis.yml@v5
    with:
      languages: '["actions", "javascript-typescript", "python"]'
    permissions:
      contents: read
      security-events: write
