---
name: Render Release Docs

# Trigger-only stub: the reusable render-docs workflow in
# felddy/reusable-workflows re-renders the docs on the release branch
# and pushes with the release-please PAT so the PR's checks re-run.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - release-please--branches--develop

permissions: {}

jobs:
  render:
    uses: felddy/reusable-workflows/.github/workflows/render-docs.yml@v5
    permissions:
      contents: write
    secrets: inherit
