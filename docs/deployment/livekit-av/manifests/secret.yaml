---
# A plain Secret to get started.  For real clusters, keep secrets out of git
# using Sealed Secrets, SOPS, or the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: livekit
type: Opaque
stringData:
  # One "key: secret" pair, the same format as the `keys` block of a
  # livekit.yaml.  Generate a pair with:
  #   docker run --rm livekit/livekit-server:v1.13.7 generate-keys
  LIVEKIT_KEYS: "<api_key>: <api_secret>"
