---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundryvtt
  namespace: foundryvtt
  labels:
    app.kubernetes.io/name: foundryvtt
spec:
  # Foundry keeps live data on a single ReadWriteOnce volume, so exactly one
  # replica may run at a time.  The "Recreate" strategy stops the old pod before
  # starting the new one, preventing two pods from writing the same volume
  # during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: foundryvtt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundryvtt
    spec:
      # A fixed hostname keeps Foundry's license binding stable across pod
      # restarts.  See the guide for details.
      hostname: foundryvtt
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: foundry
          image: ghcr.io/felddy/foundryvtt:14
          # The major tag is a moving target; always re-pull so a rollout picks
          # up the newest compatible release.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 30000
          env:
            - name: CONTAINER_CACHE
              value: /data/container_cache
            - name: FOUNDRY_HOSTNAME
              value: vtt.example.com
            # Set to "true" when a gateway / load balancer terminates TLS so
            # invitation links and A/V use https.
            - name: FOUNDRY_PROXY_SSL
              value: "true"
            - name: FOUNDRY_TELEMETRY
              value: "true"
          # Kubernetes ignores the image's built-in Docker HEALTHCHECK, so the
          # probes are declared here against Foundry's status endpoint.  The
          # first start downloads and installs the Foundry distribution, which
          # can take minutes on a slow link; the startup probe budgets for
          # that before the liveness probe takes over.  If you set
          # FOUNDRY_ROUTE_PREFIX, prepend it to the probe paths.
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # Mounted as a directory: a subPath file mount would need the
            # image to already contain /run/secrets, and subPath interacts
            # poorly with the read-only root filesystem on some runtimes.
            - name: config
              mountPath: /run/secrets
              readOnly: true
            # The root filesystem is read-only, so the few paths written
            # outside /data are backed by ephemeral emptyDir volumes.  The
            # image ships resources/ empty and the entrypoint installs the
            # Foundry distribution into it at startup; with the emptyDir the
            # install is repeated from the CONTAINER_CACHE zip on every pod
            # start.  If you build a pre-installed image, drop the resources
            # mount so the baked-in application stays visible.
            - name: resources
              mountPath: /home/node/resources
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: foundryvtt-data
        - name: config
          secret:
            secretName: foundryvtt-config
            items:
              - key: config.json
                path: config.json
        - name: resources
          emptyDir: {}
        - name: tmp
          emptyDir: {}
