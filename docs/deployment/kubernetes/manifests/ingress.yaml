---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundryvtt
  namespace: foundryvtt
  # TLS is typically handled by your ingress controller together with
  # cert-manager.  Add the appropriate annotations and a `tls:` block for your
  # environment.
spec:
  rules:
    - host: vtt.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foundryvtt
                port:
                  number: 80
