---
# A plain Secret to get started.  For real clusters, keep secrets out of git
# using Sealed Secrets, SOPS, or the External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: foundryvtt-config
  namespace: foundryvtt
type: Opaque
stringData:
  # Mounted at /run/secrets/config.json in the container.  See the secrets
  # reference: ../../../README.md#secrets
  config.json: |
    {
      "foundry_admin_key": "<your_admin_key>",
      "foundry_username": "<your_username>",
      "foundry_password": "<your_password>"
    }
