[project]
name = "foundryvtt-docker"
version = "0.0.0"
description = "Test/tooling environment for the FoundryVTT Docker image"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "semver>=3"]

[dependency-groups]
test = [
    "coverage",
    "coveralls",
    "docker",
    "hypothesis",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
dev = ["mypy", { include-group = "test" }]

[tool.uv]
package = false
constraint-dependencies = ["click>=8.3.3"]

[tool.pytest.ini_options]
addopts = "--capture=no --color=yes --runslow --verbose -rA"
log_cli = true
log_cli_level = "INFO"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
