# Repo-specific layer over the central pre-commit base in
# felddy/reusable-workflows lint-config/pre-commit-base.yaml, taken at
# the release pinned below. Renovate bumps the pin and runs
# `sh lint-config-update` in the same PR to regenerate the merged
# .pre-commit-config.yaml; the lint render check compares against the
# pinned release, so central releases never stale this repository.
# renovate: datasource=github-releases depName=felddy/reusable-workflows
# lint-base-version: v5.6.0
---
repos:
  - repo: local
    hooks:
      - id: render-docs-check
        name: render-docs-check
        language: system
        entry: ./render-docs-check
        files: ^(.*\.j2|docs/.*|README\.md|src/version\.txt)$
        pass_filenames: false
